["Prof Dr Shoab Ahmad Khan","APICTA / CARE","Pakistan","CEO, CARE Pvt Ltd","shoab@case.edu.pk / kshoab@yahoo.com",L+"kshoab/","Invitation scheduled","",INV],
["Mr. Sajjad Mustafa Syed","APICTA / ExD","Pakistan","Chairman, Excellence Delivered (ExD)","sajjad.syed@exdnow.com",L+"sajjad-syed-exd/","Invitation scheduled","",INV],
["Ali Hasani","APICTA / P@SHA","Pakistan","Economy Coordinator (Secretary General), P@SHA","hasani@gmail.com",L+"hasani1/","Invitation scheduled","",INV],
["Dr. Dayan Rajapakse","APICTA / FITIS","Sri Lanka","Chairman, Federation of Information Technology Industry Sri Lanka (FITIS)","dayan@esoft.lk",L+"dayan-rajapakse-94489146/","Invitation scheduled","",INV],
["Mr. Kalinga Ihalagedara","APICTA / FITIS","Sri Lanka","President of Software Chapter, FITIS","kalingai@orelit.com",L+"kalingaihalagedara/","Invitation scheduled","",INV],
["Rikaz Moin","APICTA / FITIS","Sri Lanka","Economy Coordinator (Vice President Software Chapter), FITIS","rikaz@dmsswt.com",L+"rikazm/","Invitation scheduled","",INV],
["Isuru Sirinimal","APICTA / BCS Sri Lanka","Sri Lanka","Economy Coordinator, APICTA / Director of Edge Tech Innovation","isuru.sirinimal@yahoo.com",L+"isuru-sirinimal/","Invitation scheduled","",INV]
];

let db=null, leads=[], logs=[], pending=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const now=()=>new Date().toISOString();
const mk=(r,i)=>({id:"s"+(i+1),name:r[0],assoc:r[1],country:r[2],role:r[3],email:r[4],linkedin:r[5],status:r[6],date:r[7]||"",notes:r[8]||"",by:"",at:""});
const configured=()=>FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey.indexOf("YOUR_")!==0&&FIREBASE_CONFIG.databaseURL.indexOf("YOUR_")===-1;
function showMsg(type,text){const m=$("msg");m.className=type;m.textContent=text}
function hideMsg(){$("msg").className="";$("msg").textContent=""}
function sortLeads(a){
  return a.sort((x,y)=>{
    const xs=x.id[0]==="s", ys=y.id[0]==="s";
    if(xs&&ys) return parseInt(x.id.slice(1))-parseInt(y.id.slice(1));
    if(xs) return 1; if(ys) return -1;
    return y.id.localeCompare(x.id);
  });
}

async function init(){
  if(configured()){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db=firebase.database();
    }catch(e){ showMsg("err","Firebase failed to start: "+e.message); }
    $("mode").textContent="Shared mode (live)";
    db.ref("leads").on("value",s=>{
      const v=s.val()||{};
      leads=sortLeads(Object.values(v));
      $("seedBtn").style.display="inline-block";
      if(!leads.length) showMsg("info","The database is empty. Click \"Sync sheet data\" to load the contacts.");
      else hideMsg();
      if(!document.activeElement||!document.activeElement.closest("#tb"))render();
    },err=>{
      showMsg("err","Cannot read the database: "+err.message+". In Firebase, open Realtime Database, then Rules, set read and write to true, and click Publish.");
    });
    db.ref("log").orderByChild("at").limitToLast(100).on("value",s=>{
      const arr=[]; s.forEach(c=>{arr.push(c.val())});
      logs=arr.reverse(); renderLog();
    },()=>{});
  }else{
    leads=JSON.parse(localStorage.getItem("seala13_leads")||"null")||SEED.map(mk);
    logs=JSON.parse(localStorage.getItem("seala13_log")||"[]");
    saveLocal();
  }
  $("who").value=localStorage.getItem("seala13_name")||"";
  render();
}
function saveLocal(){localStorage.setItem("seala13_leads",JSON.stringify(leads));localStorage.setItem("seala13_log",JSON.stringify(logs.slice(0,100)))}
async function persist(l){
  if(db){ try{ await db.ref("leads/"+l.id).set(l); }catch(e){ showMsg("err","Save failed: "+e.message); } }
  else saveLocal();
}
async function addLog(who,text){
  const e={who,text,at:now()};
  if(db){ try{ await db.ref("log").push(e); }catch(x){} } else {logs.unshift(e);saveLocal();renderLog();}
}
async function seed(){
  if(!confirm("This REPLACES the whole live list with the "+SEED.length+" contacts from the sheet. Any other rows and edits will be removed. Continue?"))return;
  const obj={};
  SEED.map(mk).forEach(l=>{obj[l.id]=l});
  try{
    showMsg("info","Loading contacts...");
    await db.ref("leads").set(obj);
    hideMsg();
  }catch(e){
    showMsg("err","Could not load data: "+e.message+". Check Realtime Database, then Rules, set read and write to true and click Publish.");
  }
}

function render(){
  const q=$("q").value.toLowerCase(), fs=$("fs").value, fc=$("fc").value;
  const countries=[...new Set(leads.map(l=>l.country).filter(Boolean))].sort();
  if(!$("fs").options.length){$("fs").innerHTML='<option value="">All statuses</option>'+STATUSES.map(s=>`<option>${s}</option>`).join("")}
  const cur=$("fc").value;
  $("fc").innerHTML='<option value="">All countries</option>'+countries.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
  const rows=leads.filter(l=>(!fs||l.status===fs)&&(!fc||l.country===fc)&&(!q||JSON.stringify(l).toLowerCase().includes(q)));
  $("tb").innerHTML=rows.map(l=>`<tr>
    ${["name","assoc","country","role","email"].map(f=>`<td><input value="${esc(l[f])}" data-id="${l.id}" data-f="${f}" onchange="edit(this)"></td>`).join("")}
    <td style="display:flex;align-items:center"><input value="${esc(l.linkedin)}" data-id="${l.id}" data-f="linkedin" onchange="edit(this)">${l.linkedin?`<a href="${esc(l.linkedin)}" target="_blank" title="Open">&#128279;</a>`:""}</td>
    <td><select class="s-${(l.status||"Not started").replace(/ /g,"-")}" data-id="${l.id}" data-f="status" onchange="edit(this)">${STATUSES.map(s=>`<option ${s===l.status?"selected":""}>${s}</option>`).join("")}</select></td>
    <td><input type="date" value="${esc(l.date)}" data-id="${l.id}" data-f="date" onchange="edit(this)"></td>
    <td><input value="${esc(l.notes)}" data-id="${l.id}" data-f="notes" onchange="edit(this)"></td>
    <td style="font-size:11px;color:#667;white-space:nowrap">${l.by?esc(l.by)+"<br>"+new Date(l.at).toLocaleDateString():""}</td>
    <td><button class="ghost" onclick="del('${l.id}')">&#10005;</button></td></tr>`).join("");
  const cnt=s=>leads.filter(l=>l.status===s).length;
  const inSet=a=>leads.filter(l=>a.includes(l.status)).length;
  $("cards").innerHTML=[["Total",leads.length],["Replied",cnt("Replied")],["Scheduled",inSet(SCHEDULED)],["Address flagged",inSet(FLAGGED)],["Interested",cnt("Interested")],["Nominated",cnt("Nominated")],["Declined",cnt("Declined")]].map(c=>`<div class="card"><b>${c[1]}</b><span>${c[0]}</span></div>`).join("");
  renderLog();
}
function renderLog(){ $("log").innerHTML=logs.slice(0,30).map(e=>`<div><b>${esc(e.who)}</b> ${esc(e.text)} <span style="color:#889">(${new Date(e.at).toLocaleString()})</span></div>`).join("")||"<div>No changes yet.</div>"; }

function edit(el){
  const l=leads.find(x=>x.id===el.dataset.id), f=el.dataset.f;
  if(l[f]===el.value)return;
  const label={assoc:"association"}[f]||f;
  pending={type:"edit",id:l.id,f,old:l[f],val:el.value,msg:`${l.name}: ${label} "${l[f]}" to "${el.value}"`,html:`<b>${esc(l.name)}</b><br>${esc(label)}: "${esc(l[f])}" &rarr; "${esc(el.value)}"`};
  openModal();
}
function addLead(){
  pending={type:"add",msg:"added a new lead",html:"Add a new blank lead to the tracker."};
  openModal();
}
function del(id){
  const l=leads.find(x=>x.id===id);
  pending={type:"del",id,msg:`deleted lead ${l.name}`,html:`Delete <b>${esc(l.name)}</b> from the tracker.`};
  openModal();
}
function openModal(){ $("mchg").innerHTML=pending.html; $("m").classList.add("on"); $("who").focus(); }
function cancelChange(){ pending=null; $("m").classList.remove("on"); render(); }
async function confirmChange(){
  const who=$("who").value.trim();
  if(!who){$("who").style.borderColor="red";return;}
  $("who").style.borderColor="";
  localStorage.setItem("seala13_name",who);
  const p=pending; pending=null; $("m").classList.remove("on");
  if(p.type==="edit"){
    const l=leads.find(x=>x.id===p.id); l[p.f]=p.val; l.by=who; l.at=now();
    await persist(l); await addLog(who,"changed "+p.msg);
  }else if(p.type==="add"){
    const l={id:"n"+Date.now(),name:"New lead",assoc:"",country:"",role:"",email:"",linkedin:"",status:"Not started",date:"",notes:"",by:who,at:now()};
    if(!db) leads.unshift(l);
    await persist(l); await addLog(who,"added a new lead");
  }else if(p.type==="del"){
    if(db){ try{ await db.ref("leads/"+p.id).remove(); }catch(e){ showMsg("err","Delete failed: "+e.message); } } else {leads=leads.filter(x=>x.id!==p.id);saveLocal();}
    await addLog(who,p.msg);
  }
  render();
}
function exportCSV(){
  const h=["name","assoc","country","role","email","linkedin","status","date","notes","by","at"];
  const csv=[h.join(",")].concat(leads.map(l=>h.map(k=>'"'+String(l[k]||"").replace(/"/g,'""')+'"').join(","))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="seala13_outreach.csv";a.click();
}
init();
</script>
